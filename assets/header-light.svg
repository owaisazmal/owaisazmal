<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Owais Khan</title>
  <desc id="desc">Mobile developer in Los Angeles. Apps for iPhone, iPad and Android.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.3s cubic-bezier(.6, 0, .2, 1) both }
    .d2 { animation-delay: .25s }
    .d3 { animation-delay: .5s }
    @keyframes draw { from { stroke-dashoffset: 1 } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#111318" fill-opacity="0.09"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="reveal">
      <rect width="960" height="280" fill="url(#fade)"/>
    </mask>
    <clipPath id="card">
      <rect x=".5" y=".5" width="959" height="279" rx="20"/>
    </clipPath>
  </defs>
  <rect x=".5" y=".5" width="959" height="279" rx="20" fill="#f6f7f9" stroke="#dfe2e7"/>
  <g clip-path="url(#card)">
    <rect width="960" height="280" fill="url(#dots)" mask="url(#reveal)"/>
